[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subcheck"
version = "0.3.0"
description = "Decode GitHub Actions OIDC token claims and validate them against an expected-claims policy - a CI gate against over-broad cloud trust."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Dashti" }]
keywords = ["oidc", "github-actions", "aws-iam", "cicd-security", "supply-chain-security", "least-privilege"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Intended Audience :: Developers",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# subvectors is pinned EXACTLY: it is the cited source of the decoder fixture,
# and the everyday drift check must move only when this pin is bumped
# deliberately - never because upstream released. Bump = re-derive the fixture.
# The marker keeps the py3.10 leg installable (subvectors needs >=3.11); the
# provenance test importorskips there.
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "mypy>=1.8",
    "types-PyYAML>=6",
    "ruff>=0.4",
    "bandit>=1.7",
    'subvectors==0.2.0; python_version >= "3.11"',
]

[project.urls]
Homepage = "https://github.com/Dashtid/subcheck"
Related = "https://github.com/Dashtid/subvectors"

[project.scripts]
subcheck = "subcheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subcheck"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
