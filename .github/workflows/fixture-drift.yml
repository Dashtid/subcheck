name: Fixture drift vs subvectors

# The github_subjects.json fixture is derived from the subvectors vector
# suite. This job checks it against the RELEASE pinned in the dev extra, in
# the three directions scripts/check_fixture_drift.py runs: provenance (every
# fixture subject still exists in the pinned corpus), coverage (every github
# subject there decodes) and mis-parse (no decoded value absorbs a later claim
# key). Deterministic: it drifts only when the pin is bumped. Runs on changes
# to the fixture, the checker, the decoder it checks (src/subcheck/decoder.py,
# the only module of this package the checker calls), the pin, or this
# workflow.
#
# ci.yml's pytest run repeats only the provenance direction
# (tests/test_fixture_provenance.py); coverage and mis-parse over the whole
# pinned corpus run here alone.
#
# There is no canary against subvectors main any more. subvectors is archived,
# so its main branch can no longer grow a subject form the decoder has not
# seen; the weekly and manual run that watched for one was removed 2026-11-06.

on:
  push:
    paths:
      - tests/fixtures/github_subjects.json
      - scripts/check_fixture_drift.py
      - src/subcheck/decoder.py
      - pyproject.toml
      - .github/workflows/fixture-drift.yml
  pull_request:
    paths:
      - tests/fixtures/github_subjects.json
      - scripts/check_fixture_drift.py
      - src/subcheck/decoder.py
      - pyproject.toml
      - .github/workflows/fixture-drift.yml

permissions:
  contents: read

jobs:
  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install with the pinned corpus
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check fixture drift against the pinned release
        run: python scripts/check_fixture_drift.py --installed
